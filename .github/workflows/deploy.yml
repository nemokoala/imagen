name: Deploy Next.js to WSL

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      # ✅ ~/.env.next에서 NEXT_PUBLIC_* 변수만 추출하여 .env.production 생성
      - name: Create .env.production from ~/.env.next
        working-directory: ${{ github.workspace }}
        run: |
          # NEXT_PUBLIC_*로 시작하는 변수만 추출 (set -a 없이 직접 grep)
          grep -E '^NEXT_PUBLIC_' ~/.env.next > .env.production 2>/dev/null || true
          echo "✅ Created .env.production with NEXT_PUBLIC_* variables"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      # 🔸 Prisma 마이그레이션 (스키마 변경시에만 실행됨)
      - name: Run Prisma Migrations
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          # 쌍따옴표/단따옴표 제거 후 로드 (값의 시작과 끝 따옴표만 제거)
          sed -E "s/^([^=]+)=[\"'](.*)[\"']$/\1=\2/" ~/.env.next > /tmp/.env.next.clean 2>/dev/null || cp ~/.env.next /tmp/.env.next.clean
          . /tmp/.env.next.clean || true
          set +a
          npx prisma migrate deploy

      # Build Next.js project
      - name: Build Next.js project
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          # 쌍따옴표/단따옴표 제거 후 로드 (값의 시작과 끝 따옴표만 제거)
          sed -E "s/^([^=]+)=[\"'](.*)[\"']$/\1=\2/" ~/.env.next > /tmp/.env.next.clean 2>/dev/null || cp ~/.env.next /tmp/.env.next.clean
          . /tmp/.env.next.clean || true
          set +a
          npm run build

      - name: Copy static files and public folder for standalone
        working-directory: ${{ github.workspace }}
        run: |
          # .next/static을 standalone/.next/static으로 복사
          mkdir -p .next/standalone/.next
          rsync -a .next/static .next/standalone/.next/

          # public 폴더를 standalone/public으로 복사
          rsync -a public .next/standalone/ || true

          echo "✅ Static files and public folder copied to standalone"

      # 🔸 외부 uploads 디렉토리 생성 (없을 경우)
      - name: Ensure uploads directory exists
        run: |
          set -a
          # 쌍따옴표/단따옴표 제거 후 로드 (값의 시작과 끝 따옴표만 제거)
          sed -E "s/^([^=]+)=[\"'](.*)[\"']$/\1=\2/" ~/.env.next > /tmp/.env.next.clean 2>/dev/null || cp ~/.env.next /tmp/.env.next.clean
          . /tmp/.env.next.clean || true
          set +a
          # UPLOAD_PATH가 설정되어 있으면 해당 경로 사용, 없으면 기본 경로
          UPLOAD_DIR="${UPLOAD_PATH:-$HOME/uploads}"
          mkdir -p "$UPLOAD_DIR"
          echo "✅ Uploads directory: $UPLOAD_DIR"

      - name: Reload PM2 process (Zero Downtime)
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          # 쌍따옴표/단따옴표 제거 후 로드 (값의 시작과 끝 따옴표만 제거)
          sed -E "s/^([^=]+)=[\"'](.*)[\"']$/\1=\2/" ~/.env.next > /tmp/.env.next.clean 2>/dev/null || cp ~/.env.next /tmp/.env.next.clean
          . /tmp/.env.next.clean || true
          set +a

          # Firebase 환경 변수 확인 및 이스케이프 처리
          # \n 이스케이프를 실제 줄바꿈으로 변환
          if [ -n "$FIREBASE_PRIVATE_KEY" ]; then
            export FIREBASE_PRIVATE_KEY=$(echo "$FIREBASE_PRIVATE_KEY" | sed 's/\\n/\n/g')
          fi

          echo "🔄 PM2 Reloading..."

          # instances 수가 변경된 경우를 대비해 완전 재시작
          # pm2 reload는 instances 수 변경을 반영하지 않으므로 delete 후 start 사용
          pm2 delete imagen-app 2>/dev/null || true
          pm2 start ecosystem.config.js --env production

          # 설정 저장 (재부팅 대비)
          pm2 save

          echo "✅ Deploy Complete!"
