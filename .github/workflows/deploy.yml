name: Deploy Next.js to WSL

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20

    steps:
      # 🔸 청크 백업 (외부 경로인 $HOME에 백업)
      - name: Backup previous static files
        run: |
          if [ -d ".next/standalone/.next/static" ]; then
            echo "📦 Backing up previous static files to $HOME/next_static_backup..."
            rm -rf $HOME/next_static_backup
            mkdir -p $HOME/next_static_backup
            # cp -r 대신 rsync -a를 사용하여 타임스탬프 보존 (오래된 파일 정리 위해 필수)
            rsync -a .next/standalone/.next/static/ $HOME/next_static_backup/
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      # ✅ ~/.env.next에서 NEXT_PUBLIC_* 변수만 추출하여 .env.production 생성
      - name: Create .env.production from ~/.env.next
        working-directory: ${{ github.workspace }}
        run: |
          # NEXT_PUBLIC_*로 시작하는 변수만 추출 (set -a 없이 직접 grep)
          grep -E '^NEXT_PUBLIC_' ~/.env.next > .env.production 2>/dev/null || true
          echo "✅ Created .env.production with NEXT_PUBLIC_* variables"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      # 🔸 Prisma 마이그레이션 (스키마 변경시에만 실행됨)
      - name: Run Prisma Migrations
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          . ~/.env.next || true   # DATABASE_URL 로드
          set +a
          npx prisma migrate deploy

      # Build Next.js project
      - name: Build Next.js project
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          . ~/.env.next || true   # 🔸 서버 런타임 비밀 주입
          set +a
          npm run build

      - name: Copy static files and public folder for standalone
        working-directory: ${{ github.workspace }}
        run: |
          # .next/static을 standalone/.next/static으로 복사
          mkdir -p .next/standalone/.next
          rsync -a .next/static .next/standalone/.next/

          # 🔸 백업해둔 이전 파일 복구 (새 파일 덮어쓰기 금지)
          if [ -d "$HOME/next_static_backup" ]; then
            echo "♻️ Restoring previous static files..."
            rsync -a --ignore-existing $HOME/next_static_backup/ .next/standalone/.next/static/
            rm -rf $HOME/next_static_backup
          fi

          # 🔸 오래된 정적 파일 정리 (7일 이상 된 파일 삭제) - 무한 누적 방지
          echo "🧹 Cleaning up old static files..."
          find .next/standalone/.next/static -type f -mtime +7 -delete

          # public 폴더를 standalone/public으로 복사
          rsync -a public .next/standalone/ || true

          echo "✅ Static files and public folder copied to standalone"

      # 🔸 외부 uploads 디렉토리 생성 (없을 경우)
      - name: Ensure uploads directory exists
        run: |
          set -a
          . ~/.env.next || true
          set +a
          # UPLOAD_PATH가 설정되어 있으면 해당 경로 사용, 없으면 기본 경로
          UPLOAD_DIR="${UPLOAD_PATH:-$HOME/uploads}"
          mkdir -p "$UPLOAD_DIR"
          echo "✅ Uploads directory: $UPLOAD_DIR"

      - name: Reload PM2 process (Zero Downtime)
        working-directory: ${{ github.workspace }}
        run: |
          echo "📂 Copying env file to standalone directory..."
          cp ~/.env.next .next/standalone/.env.production

          echo "🔄 PM2 Reloading..."

          # [변경] --update-env 옵션 제거 (이제 PM2가 주입할 필요 없음)
          # 그냥 재시작하면 Next.js가 알아서 옆에 있는 .env.production을 읽음
          pm2 reload ecosystem.config.js || pm2 start ecosystem.config.js

          pm2 save
          echo "✅ Deploy Complete!"
