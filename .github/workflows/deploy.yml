name: Deploy Next.js to WSL

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20

    # ✅ Secrets → env로 승급 (if에서 사용 가능)
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      # ✅ 클라이언트용 env가 있을 때만 생성
      - name: Create .env.production
        if: ${{ env.NEXT_PUBLIC_API_URL != '' }}
        working-directory: ${{ github.workspace }}
        run: |
          cat > .env.production << 'EOF'
          NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
          EOF

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      # 🔸 Prisma 마이그레이션 (스키마 변경시에만 실행됨)
      - name: Run Prisma Migrations
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          . ~/.env.next || true   # DATABASE_URL 로드
          set +a
          npx prisma migrate deploy

      # Build Next.js project (수정)
      - name: Build Next.js project
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          . ~/.env.next || true   # 🔸 서버 런타임 비밀 주입
          set +a
          npm run build

      - name: Copy static for standalone
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p .next/standalone/.next
          rsync -a .next/static .next/standalone/.next/

      # 🔸 외부 uploads 디렉토리 생성 (없을 경우)
      - name: Ensure uploads directory exists
        run: |
          set -a
          . ~/.env.next || true
          set +a
          # UPLOAD_PATH가 설정되어 있으면 해당 경로 사용, 없으면 기본 경로
          UPLOAD_DIR="${UPLOAD_PATH:-$HOME/uploads}"
          mkdir -p "$UPLOAD_DIR"
          echo "✅ Uploads directory: $UPLOAD_DIR"

      - name: Restart PM2 process
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          . ~/.env.next || true
          set +a
          export APP_CWD="$GITHUB_WORKSPACE"   # 🔸 ecosystem.config.js의 cwd로 전달됨
          pm2 delete imagen-app || true
          pm2 startOrReload "$GITHUB_WORKSPACE/ecosystem.config.js" --env production --update-env
          pm2 save
