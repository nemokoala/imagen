name: Deploy Next.js to WSL

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      # ✅ ~/.env.next에서 NEXT_PUBLIC_* 변수만 추출하여 .env.production 생성
      - name: Create .env.production from ~/.env.next
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          . ~/.env.next || true
          set +a
          # NEXT_PUBLIC_*로 시작하는 변수만 추출
          grep -E '^NEXT_PUBLIC_' ~/.env.next > .env.production 2>/dev/null || true
          echo "✅ Created .env.production with NEXT_PUBLIC_* variables"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      # 🔸 Prisma 마이그레이션 (스키마 변경시에만 실행됨)
      - name: Run Prisma Migrations
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          . ~/.env.next || true   # DATABASE_URL 로드
          set +a
          npx prisma migrate deploy

      # Build Next.js project
      - name: Build Next.js project
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          . ~/.env.next || true   # 🔸 서버 런타임 비밀 주입
          set +a
          npm run build

      - name: Copy static files and public folder for standalone
        working-directory: ${{ github.workspace }}
        run: |
          # .next/static을 standalone/.next/static으로 복사
          mkdir -p .next/standalone/.next
          rsync -a .next/static .next/standalone/.next/
          
          # public 폴더를 standalone/public으로 복사
          rsync -a public .next/standalone/ || true
          
          echo "✅ Static files and public folder copied to standalone"

      # 🔸 외부 uploads 디렉토리 생성 (없을 경우)
      - name: Ensure uploads directory exists
        run: |
          set -a
          . ~/.env.next || true
          set +a
          # UPLOAD_PATH가 설정되어 있으면 해당 경로 사용, 없으면 기본 경로
          UPLOAD_DIR="${UPLOAD_PATH:-$HOME/uploads}"
          mkdir -p "$UPLOAD_DIR"
          echo "✅ Uploads directory: $UPLOAD_DIR"

      - name: Reload PM2 process (Zero Downtime)
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          . ~/.env.next || true
          set +a
          
          echo "🔄 PM2 Reloading..."
          
          # 1. 프로세스가 떠 있으면 Reload(무중단), 없으면 Start
          # --update-env: 환경변수가 바뀌었을 경우를 대비해 갱신
          pm2 reload ecosystem.config.js --env production --update-env || pm2 start ecosystem.config.js --env production

          # 2. 설정 저장 (재부팅 대비)
          pm2 save
          
          echo "✅ Deploy Complete!"
