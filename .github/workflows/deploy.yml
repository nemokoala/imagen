name: Deploy Next.js to WSL

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      # ✅ ~/.env.next에서 NEXT_PUBLIC_* 변수만 추출하여 .env.production 생성
      - name: Create .env.production from ~/.env.next
        working-directory: ${{ github.workspace }}
        run: |
          grep -E '^NEXT_PUBLIC_' ~/.env.next > .env.production 2>/dev/null || true
          echo "✅ Created .env.production with NEXT_PUBLIC_* variables"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      # 🔸 Prisma 마이그레이션 (스키마 변경시에만 실행됨)
      - name: Run Prisma Migrations
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          . ~/.env.next || true
          set +a
          npx prisma migrate deploy

      # ====================================================
      # 🔸 여기서부터 빌드: PM2는 여전히 이전 빌드를 서빙 중
      #    ($HOME/imagen-app symlink → 이전 빌드 디렉토리)
      # ====================================================

      - name: Build Next.js project
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          . ~/.env.next || true
          set +a
          npm run build

      # 🔸 타임스탬프 기반 배포 디렉토리 준비
      - name: Prepare deployment directory
        working-directory: ${{ github.workspace }}
        run: |
          DEPLOY_DIR=$HOME/imagen-builds/$(date +%s)
          echo "DEPLOY_DIR=$DEPLOY_DIR" >> $GITHUB_ENV
          mkdir -p $DEPLOY_DIR

          # 1. standalone 출력을 배포 디렉토리로 복사
          cp -a .next/standalone/. $DEPLOY_DIR/

          # 2. 새 빌드의 static 파일 복사
          mkdir -p $DEPLOY_DIR/.next
          rsync -a .next/static/ $DEPLOY_DIR/.next/static/

          # 3. 이전 빌드의 static 청크 복원 (이전 빌드 해시를 참조하는 유저 지원)
          CURRENT_TARGET=$(readlink -f $HOME/imagen-app 2>/dev/null || echo "")
          if [ -n "$CURRENT_TARGET" ] && [ -d "$CURRENT_TARGET/.next/static" ]; then
            echo "♻️ Restoring previous build's static chunks..."
            rsync -a --ignore-existing $CURRENT_TARGET/.next/static/ $DEPLOY_DIR/.next/static/
          fi

          # 4. public 폴더 복사
          rsync -a public/ $DEPLOY_DIR/public/ || true

          # 5. .env.production 복사 (서버 런타임 비밀 포함)
          cp ~/.env.next $DEPLOY_DIR/.env.production

          echo "✅ Deployment directory prepared: $DEPLOY_DIR"

      # 🔸 외부 uploads 디렉토리 생성 (없을 경우)
      - name: Ensure uploads directory exists
        run: |
          set -a
          . ~/.env.next || true
          set +a
          UPLOAD_DIR="${UPLOAD_PATH:-$HOME/uploads}"
          mkdir -p "$UPLOAD_DIR"
          echo "✅ Uploads directory: $UPLOAD_DIR"

      # ====================================================
      # 🔸 핵심: 심볼릭 링크를 원자적으로 교체
      #    ln -sfn은 atomic operation이므로 전환 순간 다운타임 없음
      # ====================================================

      - name: Switch to new deployment (atomic symlink swap)
        run: |
          # ln -sfn: 기존 심볼릭 링크를 원자적으로 새 경로로 교체
          ln -sfn ${{ env.DEPLOY_DIR }} $HOME/imagen-app
          echo "✅ Symlink updated: $HOME/imagen-app → ${{ env.DEPLOY_DIR }}"

      - name: Reload PM2 process (Zero Downtime)
        working-directory: ${{ github.workspace }}
        run: |
          echo "🔄 PM2 Reloading..."

          EXPECTED_CWD="/home/koala/imagen-app"

          # PM2에 등록된 앱의 현재 cwd 확인
          CURRENT_CWD=$(pm2 jlist 2>/dev/null | \
            python3 -c "import sys,json; apps=json.load(sys.stdin); print(next((a['pm2_env']['pm_cwd'] for a in apps if a['name']=='imagen-app'), ''))" \
            2>/dev/null || echo "")

          if [ "$CURRENT_CWD" = "$EXPECTED_CWD" ]; then
            # cwd가 동일 → rolling restart (zero downtime)
            echo "✅ PM2 cwd matches. Performing rolling reload..."
            pm2 reload ecosystem.config.js
          else
            # cwd가 다름 (최초 배포 또는 설정 변경) → 강제 재시작
            echo "⚠️ PM2 cwd mismatch: '$CURRENT_CWD' ≠ '$EXPECTED_CWD'"
            echo "🔸 Performing fresh start with new config..."
            pm2 delete imagen-app 2>/dev/null || true
            pm2 start ecosystem.config.js
          fi

          pm2 save
          echo "✅ Deploy Complete!"

      # 🔸 오래된 빌드 정리 (최근 3개만 유지)
      - name: Cleanup old deployments
        run: |
          if [ -d "$HOME/imagen-builds" ]; then
            echo "🧹 Cleaning up old deployments..."
            cd $HOME/imagen-builds
            # 최근 3개 디렉토리만 유지, 나머지 삭제
            ls -dt */ 2>/dev/null | tail -n +4 | xargs rm -rf -- 2>/dev/null || true
            echo "✅ Kept latest 3 builds, removed older ones"
          fi
