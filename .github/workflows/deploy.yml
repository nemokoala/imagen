name: Deploy Next.js to WSL

on:
  push:
    branches: ["main"] # main 브랜치에 push 시 자동 실행
  workflow_dispatch: # 수동 실행도 허용

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux] # WSL 러너 라벨
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      # (선택) 빌드 시 클라이언트에서 필요한 환경변수 주입
      - name: Create .env.production
        if: ${{ secrets.NEXT_PUBLIC_API_URL != '' }}
        run: |
          cat > .env.production << 'EOF'
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js project
        run: npm run build

      - name: Restart PM2 process
        run: |
          set -a
          . ~/.env.next
          set +a
          pm2 delete next-app || true
          pm2 startOrReload $GITHUB_WORKSPACE/ecosystem.config.js --env production --update-env
          pm2 save
